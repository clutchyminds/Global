<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Président Deluxe 👑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #0a0a12; 
            --accent: #ff2e63; 
            --card-white: #ffffff;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; 
            background: var(--bg); color: white; 
            display: flex; height: 100vh; overflow: hidden; 
        }

        .hidden { display: none !important; }
        
        #game-container { 
            flex: 1; position: relative; display: flex; 
            flex-direction: column; align-items: center; 
            background: radial-gradient(circle at center, #1b1b3a 0%, #05050a 100%);
        }

        #table { 
            flex: 1; width: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding-bottom: 180px;
        }

        #last-play { 
            background: rgba(0, 0, 0, 0.3); padding: 30px; border-radius: 50px; 
            border: 2px solid rgba(255,255,255,0.05);
            min-width: 220px; min-height: 140px; display: flex; 
            gap: 15px; justify-content: center; align-items: center;
        }

        .card { 
            width: 80px; height: 115px; 
            background: var(--card-white);
            color: #1a1a2e; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1.8rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); 
            cursor: pointer; border: 1px solid #ddd; 
            position: absolute; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .card::before {
            content: attr(data-value);
            position: absolute; top: 8px; left: 8px;
            font-size: 0.9rem; line-height: 1; color: var(--accent);
        }

        .card.selected { 
            transform: translateY(-60px) scale(1.15) !important;
            border: 4px solid var(--accent);
            box-shadow: 0 25px 50px rgba(255, 46, 99, 0.6);
            z-index: 1000 !important;
        }

        .card.on-table { 
            position: relative; cursor: default; 
            transform: rotate(var(--r)) scale(0.9); 
            pointer-events: none;
        }

        #hand { 
            position: absolute; bottom: 40px; 
            display: flex; justify-content: center; 
            width: 100%; height: 120px;
            padding: 0 40px;
        }

        #turn-info { 
            position: absolute; top: 30px; font-size: 0.8rem; 
            letter-spacing: 2px; font-weight: 900; color: white; 
            background: var(--accent); padding: 12px 25px; border-radius: 50px;
            z-index: 20;
        }

        .controls { position: absolute; bottom: 200px; display: flex; gap: 10px; z-index: 20; }

        button { 
            padding: 14px 24px; border-radius: 50px; border: none; 
            cursor: pointer; font-weight: 900; background: white; 
            color: black; text-transform: uppercase; font-size: 0.75rem;
            transition: 0.2s;
        }
        button#btn-play { background: var(--accent); color: white; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        #chat-sidebar { width: 320px; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; }

        #lobby { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { background: rgba(255,255,255,0.02); padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); }
        input { padding: 15px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; width: 100%; margin-bottom: 12px; text-align: center; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            #chat-sidebar { width: 100%; height: 140px; }
            .card { width: 55px; height: 85px; font-size: 1.4rem; }
            #hand { bottom: 25px; height: 90px; }
            .controls { bottom: 150px; }
        }
    </style>
</head>
<body>

<div id="lobby">
    <div class="box">
        <h1 style="margin:0 0 25px 0; color:var(--accent); font-weight: 900; letter-spacing: 3px;">PRÉSIDENT</h1>
        <input type="text" id="p-name" placeholder="TON PSEUDO">
        <button id="btn-create" style="width:100%; margin-bottom:12px;">CRÉER UN SALON</button>
        <div style="display:flex; gap:10px;">
            <input type="text" id="r-code" placeholder="CODE" style="margin-bottom:0">
            <button id="btn-join">JOIN</button>
        </div>
        <div id="wait-zone" class="hidden">
            <p style="margin-top:25px; opacity:0.5; font-size:0.7rem;">PARTAGE CE CODE</p>
            <b id="display-code" style="color:white; font-size:2.5rem; letter-spacing:8px"></b>
            <p id="player-count" style="margin:15px 0;">Joueurs : 0</p>
            <button id="btn-start" class="hidden" style="background:#00f5d4; color: black; width:100%">LANCER</button>
        </div>
    </div>
</div>

<div id="game-container">
    <div id="turn-info">CONNEXION...</div>
    <div id="table">
        <div id="last-play"></div>
    </div>
    <div class="controls">
        <button id="btn-play">JOUER</button>
        <button id="btn-pass" style="background: rgba(255,255,255,0.05); color: white;">PASSER</button>
    </div>
    <div id="hand"></div>
</div>

<div id="chat-sidebar">
    <div id="chat-msgs" style="flex: 1; overflow-y: auto; padding: 15px; font-size: 0.8rem;"></div>
    <input type="text" id="chat-in" placeholder="Message..." style="border:none; background: rgba(0,0,0,0.3); padding:15px; color:white;">
</div>

<script>
    const config = {
        apiKey: "AIzaSyDadsPbXI4xMieRDWgZMOb3WzkP8f7aonc",
        authDomain: "mille-bornes-vibe.firebaseapp.com",
        projectId: "mille-bornes-vibe",
        databaseURL: "https://mille-bornes-vibe-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(config);
    const db = firebase.database();

    let myID = "P" + Math.floor(Math.random()*999);
    let myName = "", roomID = "", isHost = false, selectedCards = [];
    const CARD_VALS = {"3":3,"4":4,"5":5,"6":6,"7":7,"8":8,"9":9,"10":10,"V":11,"D":12,"R":13,"A":14,"2":15};

    document.getElementById('btn-create').onclick = () => {
        myName = document.getElementById('p-name').value;
        if(!myName) return;
        roomID = Math.random().toString(36).substring(2,6).toUpperCase();
        isHost = true; setupRoom();
    };

    document.getElementById('btn-join').onclick = () => {
        myName = document.getElementById('p-name').value;
        roomID = document.getElementById('r-code').value.toUpperCase();
        if(!myName || !roomID) return;
        setupRoom();
    };

    function setupRoom() {
        const ref = db.ref('rooms_pres/' + roomID);
        const playerRef = ref.child('players/' + myID);

        if(isHost) ref.set({ status: 'waiting', host: myID, lastPlay: null, turn: "", passCount: 0 });
        
        playerRef.set({ name: myName, hand: [], passed: false });

        // --- AUTO-CLEANUP LOGIC ---
        playerRef.onDisconnect().remove(); // Supprime le joueur s'il part
        
        ref.child('players').on('value', snap => {
            if(!snap.exists()) {
                ref.remove(); // Supprime la salle si plus personne
            }
        });

        document.getElementById('wait-zone').classList.remove('hidden');
        document.getElementById('display-code').innerText = roomID;

        ref.on('value', snap => {
            const data = snap.val();
            if(!data) {
                location.reload(); // Si la room disparaît, retour au lobby
                return;
            }
            updateGame(data);
        });

        ref.child('chat').on('child_added', snap => {
            const m = snap.val();
            const d = document.createElement('div');
            d.innerHTML = `<b style="color:var(--accent)">${m.u}</b> : ${m.t}`;
            document.getElementById('chat-msgs').appendChild(d);
            document.getElementById('chat-msgs').scrollTop = document.getElementById('chat-msgs').scrollHeight;
        });
    }

    document.getElementById('btn-start').onclick = () => {
        db.ref('rooms_pres/'+roomID+'/players').once('value', snap => {
            const players = snap.val();
            const ids = Object.keys(players);
            const deck = [];
            ["3","4","5","6","7","8","9","10","V","D","R","A","2"].forEach(v => { for(let i=0; i<4; i++) deck.push(v); });
            deck.sort(() => Math.random() - 0.5);
            
            const hands = {};
            deck.forEach((card, i) => {
                const id = ids[i % ids.length];
                if(!hands[id]) hands[id] = [];
                hands[id].push(card);
            });

            ids.forEach(id => {
                db.ref(`rooms_pres/${roomID}/players/${id}`).update({ 
                    hand: hands[id].sort((a,b) => CARD_VALS[a]-CARD_VALS[b])
                });
            });
            db.ref('rooms_pres/'+roomID).update({ status: 'playing', turn: ids[0] });
        });
    };

    function updateGame(data) {
        if(data.status === 'waiting') {
            const count = Object.keys(data.players || {}).length;
            document.getElementById('player-count').innerText = `Joueurs : ${count}`;
            if(isHost && count >= 2) document.getElementById('btn-start').classList.remove('hidden');
        } else {
            document.getElementById('lobby').classList.add('hidden');
            renderHand(data.players[myID].hand || []);
            renderTable(data.lastPlay);
            const isMyTurn = data.turn === myID;
            document.getElementById('turn-info').innerText = isMyTurn ? "C'est ton tour" : `Tour de ${data.players[data.turn] ? data.players[data.turn].name : '...'}`;
            document.getElementById('btn-play').disabled = !isMyTurn;
            document.getElementById('btn-pass').disabled = !isMyTurn;
        }
    }

    function renderHand(hand) {
        const container = document.getElementById('hand');
        container.innerHTML = "";
        const maxWidth = window.innerWidth > 850 ? 600 : window.innerWidth - 80;
        const spacing = Math.min(35, maxWidth / hand.length); 

        hand.forEach((card, i) => {
            const div = document.createElement('div');
            div.className = "card" + (selectedCards.includes(i) ? " selected" : "");
            div.setAttribute('data-value', card);
            div.innerText = card;
            const totalWidth = (hand.length - 1) * spacing;
            div.style.left = `calc(50% - ${totalWidth / 2}px + ${i * spacing}px)`;
            div.style.zIndex = i;
            div.onclick = () => {
                if(selectedCards.includes(i)) selectedCards = [];
                else selectedCards = [i]; 
                renderHand(hand);
            };
            container.appendChild(div);
        });
    }

    function renderTable(lastPlay) {
        const container = document.getElementById('last-play');
        container.innerHTML = "";
        if(lastPlay && lastPlay.cards) {
            lastPlay.cards.forEach((c, i) => {
                const div = document.createElement('div'); 
                div.className = "card on-table"; 
                div.setAttribute('data-value', c);
                div.innerText = c;
                div.style.setProperty('--r', `${(i - (lastPlay.cards.length-1)/2) * 12}deg`);
                div.style.zIndex = i;
                container.appendChild(div);
            });
        }
    }

    document.getElementById('btn-play').onclick = async () => {
        if(selectedCards.length === 0) return;
        const snap = await db.ref('rooms_pres/'+roomID).get();
        const data = snap.val();
        const myHand = data.players[myID].hand;
        const playedCards = selectedCards.map(idx => myHand[idx]);
        
        if(data.lastPlay) {
            if(CARD_VALS[playedCards[0]] <= CARD_VALS[data.lastPlay.cards[0]]) return;
        }

        const newHand = myHand.filter((_, idx) => !selectedCards.includes(idx));
        selectedCards = [];

        const isADeux = (playedCards[0] === "2");
        const updates = {};

        if(isADeux) {
            updates.lastPlay = null;
            updates.turn = myID;
            updates.passCount = 0;
            db.ref('rooms_pres/'+roomID+'/chat').push({ u: "⚡", t: `${myName} a coupé !` });
        } else {
            updates.lastPlay = { cards: playedCards, owner: myID, ownerName: myName };
            updates.turn = getNextPlayer(data, myID);
            updates.passCount = 0;
        }

        await db.ref('rooms_pres/'+roomID).update(updates);
        await db.ref(`rooms_pres/${roomID}/players/${myID}`).update({ hand: newHand });
        
        if(newHand.length === 0) {
            db.ref('rooms_pres/'+roomID+'/chat').push({ u: "👑", t: `${myName} a gagné !` });
        }
    };

    document.getElementById('btn-pass').onclick = async () => {
        const snap = await db.ref('rooms_pres/'+roomID).get();
        const data = snap.val();
        const playersCount = Object.keys(data.players).length;
        const nextPass = (data.passCount || 0) + 1;

        if(nextPass >= playersCount - 1) {
            db.ref('rooms_pres/'+roomID).update({ 
                lastPlay: null, 
                passCount: 0, 
                turn: data.lastPlay ? data.lastPlay.owner : getNextPlayer(data, myID) 
            });
        } else {
            db.ref('rooms_pres/'+roomID).update({ turn: getNextPlayer(data, myID), passCount: nextPass });
        }
    };

    function getNextPlayer(data, currentID) {
        const ids = Object.keys(data.players);
        return ids[(ids.indexOf(currentID) + 1) % ids.length];
    }

    document.getElementById('chat-in').onkeydown = (e) => {
        if(e.key === "Enter" && e.target.value) {
            db.ref('rooms_pres/'+roomID+'/chat').push({ u: myName, t: e.target.value });
            e.target.value = "";
        }
    };

    window.onresize = () => {
        db.ref('rooms_pres/' + roomID + '/players/' + myID + '/hand').once('value', s => {
            if(s.val()) renderHand(s.val());
        });
    };
</script>
</body>
</html>
