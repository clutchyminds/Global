<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Président Online 👑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #1a1a2e; --accent: #e94560; --glass: rgba(255,255,255,0.1); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Layout */
        #game-container { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; }
        #chat-sidebar { width: 280px; background: rgba(0,0,0,0.3); border-left: 1px solid var(--glass); display: flex; flex-direction: column; }
        
        /* Plateau */
        #table { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #last-play { 
            background: var(--glass); padding: 20px; border-radius: 15px; border: 2px dashed rgba(255,255,255,0.2);
            min-width: 180px; min-height: 120px; display: flex; gap: 10px; justify-content: center; align-items: center;
        }

        /* Cartes */
        .card { 
            width: 70px; height: 100px; background: white; color: black; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); cursor: pointer; border: 3px solid transparent;
        }
        .card.selected { border-color: var(--accent); transform: translateY(-15px); }
        .card.on-table { cursor: default; transform: none !important; }

        /* Main */
        #hand { position: absolute; bottom: 20px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; padding: 0 10px; z-index: 10; }

        /* UI */
        #turn-info { position: absolute; top: 20px; font-size: 1.5rem; font-weight: bold; color: var(--accent); background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 30px; }
        .controls { position: absolute; bottom: 160px; display: flex; gap: 10px; }
        button { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: var(--accent); color: white; text-transform: uppercase; }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.5; }

        #lobby { position: fixed; inset: 0; background: #16213e; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--glass); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid var(--glass); width: 320px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid var(--glass); background: rgba(0,0,0,0.2); color: white; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="lobby">
    <div class="box">
        <h1 style="margin-top:0">👑 Président</h1>
        <input type="text" id="p-name" placeholder="Ton Pseudo">
        <button id="btn-create" style="width:100%; margin-bottom:10px;">Créer Salon</button>
        <div style="margin:10px; opacity:0.5; font-size:0.8rem">OU REJOINDRE</div>
        <div style="display:flex; gap:5px">
            <input type="text" id="r-code" placeholder="Code" style="margin-bottom:0">
            <button id="btn-join">OK</button>
        </div>
        <div id="wait-zone" class="hidden">
            <hr style="margin:20px 0; border:0; border-top:1px solid var(--glass)">
            <p>Code: <b id="display-code" style="color:var(--accent); font-size:1.5rem"></b></p>
            <p id="player-count">Joueurs: 0</p>
            <button id="btn-start" class="hidden" style="background:#2ecc71; width:100%">Lancer la partie</button>
        </div>
    </div>
</div>

<div id="game-container">
    <div id="turn-info">En attente...</div>
    <div id="table">
        <div id="last-play"></div>
        <p id="game-msg" style="margin-top:20px; opacity:0.7"></p>
    </div>
    <div class="controls">
        <button id="btn-play">Jouer</button>
        <button id="btn-pass" style="background: #555;">Passer</button>
    </div>
    <div id="hand"></div>
</div>

<div id="chat-sidebar">
    <div style="padding: 15px; border-bottom: 1px solid var(--glass); font-weight: bold; text-align: center">CHAT</div>
    <div id="chat-msgs" style="flex: 1; overflow-y: auto; padding: 15px; font-size: 0.9rem;"></div>
    <input type="text" id="chat-in" placeholder="Message..." style="border:none; border-top:1px solid var(--glass); padding:15px; margin:0">
</div>

<script>
    const config = {
        apiKey: "AIzaSyDadsPbXI4xMieRDWgZMOb3WzkP8f7aonc",
        authDomain: "mille-bornes-vibe.firebaseapp.com",
        projectId: "mille-bornes-vibe",
        databaseURL: "https://mille-bornes-vibe-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(config);
    const db = firebase.database();

    let myID = "P" + Math.floor(Math.random()*999);
    let myName = "", roomID = "", isHost = false, selectedCards = [];
    const CARD_VALS = {"3":3,"4":4,"5":5,"6":6,"7":7,"8":8,"9":9,"10":10,"V":11,"D":12,"R":13,"A":14,"2":15};

    // --- ACTIONS BOUTONS ---
    document.getElementById('btn-create').onclick = () => {
        myName = document.getElementById('p-name').value;
        if(!myName) return alert("Pseudo requis");
        roomID = Math.random().toString(36).substring(2,6).toUpperCase();
        isHost = true;
        setupRoom();
    };

    document.getElementById('btn-join').onclick = () => {
        myName = document.getElementById('p-name').value;
        roomID = document.getElementById('r-code').value.toUpperCase();
        if(!myName || !roomID) return alert("Pseudo et Code requis");
        isHost = false;
        setupRoom();
    };

    function setupRoom() {
        const ref = db.ref('rooms_pres/' + roomID);
        
        if(isHost) {
            ref.set({
                status: 'waiting',
                host: myID,
                lastPlay: null,
                turn: "",
                passCount: 0,
                chat: { system: { u: "SYSTEM", t: "Salon créé !" } }
            });
        }

        ref.child('players/' + myID).set({
            name: myName,
            hand: [],
            passed: false
        });

        document.getElementById('wait-zone').classList.remove('hidden');
        document.getElementById('display-code').innerText = roomID;

        // Ecoute du jeu
        ref.on('value', snap => {
            const data = snap.val();
            if(!data) return;
            updateGame(data);
        });

        // Ecoute du chat
        ref.child('chat').on('child_added', snap => {
            const m = snap.val();
            const d = document.createElement('div');
            d.style.marginBottom = "5px";
            d.innerHTML = `<b style="color:var(--accent)">${m.u}:</b> ${m.t}`;
            const box = document.getElementById('chat-msgs');
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        });
    }

    document.getElementById('btn-start').onclick = () => {
        db.ref('rooms_pres/'+roomID+'/players').once('value', snap => {
            const players = snap.val();
            const ids = Object.keys(players);
            if(ids.length < 2) return alert("Il faut au moins 2 joueurs !");

            const deck = [];
            ["3","4","5","6","7","8","9","10","V","D","R","A","2"].forEach(v => { 
                for(let i=0; i<4; i++) deck.push(v); 
            });
            deck.sort(() => Math.random() - 0.5);
            
            const up = {};
            deck.forEach((card, i) => {
                const id = ids[i % ids.length];
                if(!up[id]) up[id] = [];
                up[id].push(card);
            });

            ids.forEach(id => {
                db.ref(`rooms_pres/${roomID}/players/${id}`).update({ 
                    hand: up[id].sort((a,b) => CARD_VALS[a]-CARD_VALS[b]),
                    passed: false 
                });
            });

            db.ref('rooms_pres/'+roomID).update({ status: 'playing', turn: ids[0] });
        });
    };

    function updateGame(data) {
        if(data.status === 'waiting') {
            const count = Object.keys(data.players || {}).length;
            document.getElementById('player-count').innerText = `Joueurs: ${count}`;
            if(isHost && count >= 2) document.getElementById('btn-start').classList.remove('hidden');
        } else if(data.status === 'playing') {
            document.getElementById('lobby').classList.add('hidden');
            const me = data.players[myID];
            renderHand(me.hand || []);
            renderTable(data.lastPlay);
            
            const isMyTurn = data.turn === myID;
            document.getElementById('turn-info').innerText = isMyTurn ? "🌟 TON TOUR" : `Tour de ${data.players[data.turn].name}`;
            document.getElementById('btn-play').disabled = !isMyTurn;
            document.getElementById('btn-pass').disabled = !isMyTurn;
        }
    }

    function renderHand(hand) {
        const container = document.getElementById('hand');
        container.innerHTML = "";
        hand.forEach((card, i) => {
            const div = document.createElement('div');
            div.className = "card" + (selectedCards.includes(i) ? " selected" : "");
            div.innerText = card;
            div.onclick = () => {
                if(selectedCards.includes(i)) selectedCards = selectedCards.filter(idx => idx !== i);
                else selectedCards.push(i);
                renderHand(hand);
            };
            container.appendChild(div);
        });
    }

    function renderTable(lastPlay) {
        const container = document.getElementById('last-play');
        container.innerHTML = "";
        if(lastPlay && lastPlay.cards) {
            lastPlay.cards.forEach(c => {
                const div = document.createElement('div'); div.className = "card on-table"; div.innerText = c;
                container.appendChild(div);
            });
            document.getElementById('game-msg').innerText = `Dernier coup par ${lastPlay.ownerName}`;
        } else { 
            container.innerText = "À VOUS D'OUVRIR"; 
            document.getElementById('game-msg').innerText = "";
        }
    }

    document.getElementById('btn-play').onclick = async () => {
        if(selectedCards.length === 0) return;
        const snap = await db.ref('rooms_pres/'+roomID).get();
        const data = snap.val();
        const myHand = data.players[myID].hand;
        const playedCards = selectedCards.map(idx => myHand[idx]);
        
        if(!playedCards.every(c => c === playedCards[0])) return alert("Même valeur uniquement !");
        
        if(data.lastPlay) {
            if(playedCards.length !== data.lastPlay.cards.length) return alert(`Il faut ${data.lastPlay.cards.length} cartes !`);
            if(CARD_VALS[playedCards[0]] <= CARD_VALS[data.lastPlay.cards[0]]) return alert("Plus fort requis !");
        }

        const newHand = myHand.filter((_, idx) => !selectedCards.includes(idx));
        selectedCards = [];
        
        const updates = {};
        updates.lastPlay = { cards: playedCards, owner: myID, ownerName: myName };
        updates.turn = getNextPlayer(data, myID);
        updates.passCount = 0;
        
        await db.ref('rooms_pres/'+roomID).update(updates);
        await db.ref(`rooms_pres/${roomID}/players/${myID}`).update({ hand: newHand });
        
        if(newHand.length === 0) {
            db.ref('rooms_pres/'+roomID+'/chat').push({u: "👑", t: `${myName} est libéré !`});
        }
    };

    document.getElementById('btn-pass').onclick = async () => {
        const snap = await db.ref('rooms_pres/'+roomID).get();
        const data = snap.val();
        const passCount = (data.passCount || 0) + 1;
        const ids = Object.keys(data.players);
        
        if(passCount >= ids.length - 1) {
            // Le plateau est nettoyé, la main revient à celui qui a posé en dernier
            db.ref('rooms_pres/'+roomID).update({ 
                lastPlay: null, 
                passCount: 0, 
                turn: data.lastPlay ? data.lastPlay.owner : getNextPlayer(data, myID)
            });
        } else {
            db.ref('rooms_pres/'+roomID).update({ 
                turn: getNextPlayer(data, myID), 
                passCount: passCount 
            });
        }
    };

    function getNextPlayer(data, currentID) {
        const ids = Object.keys(data.players);
        let idx = (ids.indexOf(currentID) + 1) % ids.length;
        return ids[idx];
    }

    document.getElementById('chat-in').onkeydown = (e) => {
        if(e.key === "Enter" && e.target.value) {
            db.ref('rooms_pres/'+roomID+'/chat').push({ u: myName, t: e.target.value });
            e.target.value = "";
        }
    };
</script>
</body>
</html>
