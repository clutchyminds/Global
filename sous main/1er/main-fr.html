<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Accueil - Global</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
    }
    .top-banner {
      background-color: #007BFF;
      color: white;
      padding: 18px 0 0 0;
      font-size: 2rem;
      letter-spacing: 1px;
      font-weight: bold;
    }
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      background-color: #007BFF;
      padding: 10px 0 18px 0;
      margin: 0;
    }
    .nav-bar a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      padding: 5px 18px;
      border-radius: 12px;
      transition: background 0.2s, color 0.2s;
    }
    .nav-bar a:hover {
      background: #0057b8;
      color: #fffbea;
    }
    .icon-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0px;  /* Icônes rapprochées */
      padding: 20px 0px 0 0px;
      justify-items: center;
    }
    .icon {
      text-decoration: none;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 22px;
      border: 2.5px solid #ccc;
      transition: border-color 0.3s, transform 0.3s;
    }
    .icon img:hover {
      border-color: #007BFF;
      transform: scale(1.08);
    }
    .icon span {
      margin-top: 17px;
      font-weight: bold;
      font-size: 1.15rem;
    }
    .bottom-footer {
      background-color: #333;
      color: #eee;
      padding: 16px 0;
      text-align: center;
      font-size: 1rem;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      box-shadow: 0 -1px 8px #bbb;
    }
    .page-padding {
      padding-bottom: 60px;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    Global - Espagnol
    <nav class="nav-bar">
      <a href="../../index.html">Accueil</a>
      <a href="../../apropos.html">À propos</a>
    </nav>
  </div>
  <div class="page-padding">
    <div class="icon-container">
      <a href="francais/commentaire.html" class="icon">
        <img src="../../img/commentaire.png" alt="Site 3" />
        <span>commentaire de texte</span>
      </a>
    </div>
  </div>
  <div class="bottom-footer">
    © Global — Créé par Thomas Lewis | Code : Thomas Lewis ; Comptenu : Perplexity (ia)
  </div>
</body>
</html>

<!--
Présent (presente): pour parler d'actions habituelles ou en cours. Ex : hablo, comes, vive.

: action ponctuelle et terminée dans le passé. Ex : hablé, comiste, vivió.

Imparfait (pretérito imperfecto): description ou habitude dans le passé. Ex : hablaba, comías, vivíamos.

Futur simple (futuro simple): expression de projets ou actions à venir. Ex : hablaré, comerás, vivirá.

Modes avec temps spéciaux
Subjonctif présent (presente de subjuntivo): utilisé dans les subordonnées exprimant un souhait, un doute, une nécessité. Ex : que hable, que comas.

Subjonctif imparfait: utilisé surtout dans des propositions subordonnées au passé. Ex : hablara, comiera.

Conditionnel (condicional): exprime une action soumise à une condition. Ex : hablaría, comerías.

Autres formes importantes
Impératif: pour donner des ordres ou conseils. Ex : habla (parle), come (mange).

Gérondif (gerundio): pour indiquer une action en cours. Ex : hablando, comiendo.
-->
