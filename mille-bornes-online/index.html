<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mille Bornes Royale 🏎️</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #0b0e14; 
            --accent: #f1c40f; 
            --table: linear-gradient(135deg, #1e8449 0%, #27ae60 100%);
            --card-shadow: 0 10px 20px rgba(0,0,0,0.4);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); color: white; height: 100vh; 
            display: flex; overflow: hidden;
            background-image: radial-gradient(circle at center, #1c2541 0%, #0b0e14 100%);
        }

        .hidden { display: none !important; }

        /* --- BANNIÈRE DE TOUR --- */
        #turn-indicator {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; border-radius: 50px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; z-index: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--glass);
            backdrop-filter: blur(10px); pointer-events: none; text-align: center;
            min-width: 300px;
        }
        .my-turn { 
            background: rgba(241, 196, 15, 0.2); border-color: var(--accent) !important; 
            color: var(--accent); animation: pulse 2s infinite; 
        }
        .other-turn { background: rgba(0, 0, 0, 0.6); color: rgba(255,255,255,0.6); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(241, 196, 15, 0); }
            100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }

        /* --- LAYOUT --- */
        #main-container { flex: 1; position: relative; display: flex; flex-direction: column; }
        #chat-sidebar { 
            width: 320px; background: rgba(0,0,0,0.6); border-left: 2px solid var(--glass);
            display: flex; flex-direction: column; backdrop-filter: blur(15px);
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            #chat-sidebar { width: 100%; height: 200px; border-left: none; border-top: 2px solid var(--glass); }
            #turn-indicator { width: 80%; font-size: 0.8rem; padding: 10px; top: 10px; }
        }

        /* --- LOBBY --- */
        #lobby { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1000; background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(10px); }
        .box { background: var(--glass); padding: 40px; border-radius: 30px; text-align: center; width: 90%; max-width: 450px; border: 1px solid rgba(255,255,255,0.2); }
        h1 { font-size: 2.5rem; margin-bottom: 30px; color: var(--accent); text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        input { padding: 14px; border-radius: 12px; border: none; margin: 10px 0; width: 100%; background: rgba(255,255,255,0.05); color: white; border: 1px solid transparent; }
        button { padding: 14px 28px; border-radius: 12px; border: none; background: var(--accent); color: #1a1a2e; font-weight: 800; cursor: pointer; text-transform: uppercase; width: 100%; }

        /* --- PLATEAU --- */
        #game-board { flex: 1; position: relative; perspective: 1000px; }
        #table {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%) rotateX(15deg);
            width: 85%; max-width: 600px; height: 260px; background: var(--table);
            border: 10px solid #145a32; border-radius: 130px;
            display: flex; justify-content: center; align-items: center; gap: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.5);
        }

        /* --- JOUEURS --- */
        .slot { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 110px; z-index: 10; }
        .avatar { width: 60px; height: 60px; background: #2c3e50; border-radius: 50%; border: 4px solid white; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .active .avatar { border-color: var(--accent); box-shadow: 0 0 25px var(--accent); transform: scale(1.1); }

        /* --- CARTES --- */
        #hand-container {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); 
            padding: 20px 10px; display: flex; gap: 10px; justify-content: center; z-index: 100;
        }
        .card {
            width: 85px; height: 125px; background: white; color: #1a1a2e;
            border-radius: 10px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 10px;
            font-weight: 900; font-size: 0.75rem; border: 4px solid #ccc; box-shadow: var(--card-shadow);
        }
        .card:hover { transform: translateY(-20px) scale(1.05); z-index: 110; }
        .card.borne { border-color: #2ecc71; }
        .card.attaque { border-color: #e74c3c; }
        .card.defense { border-color: #3498db; }
        .card span { font-size: 1.8rem; }

        /* --- CHAT --- */
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; font-size: 0.9rem; }
        .msg b { color: var(--accent); display: block; font-size: 0.7rem; }
        #chat-input-area { padding: 15px; background: rgba(0,0,0,0.2); display: flex; gap: 8px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass); padding: 10px; border-radius: 8px; color: white; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(10px); }
        .modal-content { background: white; color: #1a1a2e; padding: 30px; border-radius: 25px; text-align: center; width: 90%; max-width: 350px; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="turn-indicator" class="other-turn">En attente des pilotes...</div>

        <div id="lobby">
            <div id="auth-screen" class="box">
                <h1>🏎️ Mille Bornes</h1>
                <input type="text" id="p-name" placeholder="Ton pseudo...">
                <button id="btn-create">Créer Salon</button>
                <div style="margin:10px; opacity:0.5">OU</div>
                <input type="text" id="r-code" placeholder="Code">
                <button id="btn-join" style="background:transparent; color:white; border:2px solid var(--accent)">Rejoindre</button>
            </div>
            <div id="wait-screen" class="box hidden">
                <h2>Salon: <span id="display-code" style="color:var(--accent)"></span></h2>
                <ul id="p-list" style="list-style:none; padding:0; margin:20px 0; font-size:1.2rem"></ul>
                <button id="btn-start" class="hidden" style="background:#2ecc71; color:white">Lancer la Course</button>
            </div>
        </div>

        <div id="game-board" class="hidden">
            <div id="table">
                <div style="text-align:center">🎴 Pioche<br><span id="deck-count" style="font-size: 2rem; color:white">0</span></div>
                <div style="text-align:center">🗑️ Rebut<br><span id="last-card" style="font-size: 1rem; color:var(--accent)">-</span></div>
            </div>
            <div id="players-layer"></div>
            <div id="hand-container"></div>
        </div>
    </div>

    <div id="chat-sidebar">
        <div style="padding: 15px; font-weight: 900; text-align: center; border-bottom: 1px solid var(--glass);">RADIO PILOTE</div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Parle ici...">
            <button id="btn-send" style="width:auto; padding:8px 15px">OK</button>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0">Action</h2>
            <div id="modal-btns"></div>
            <button style="background:#bdc3c7; color:#2c3e50" onclick="closeModal()">Plus tard</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION FIREBASE ---
        const config = {
            apiKey: "AIzaSyDadsPbXI4xMieRDWgZMOb3WzkP8f7aonc",
            authDomain: "mille-bornes-vibe.firebaseapp.com",
            projectId: "mille-bornes-vibe",
            databaseURL: "https://mille-bornes-vibe-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        let myID = "P" + Math.floor(Math.random()*9999);
        let roomID = null;
        let isHost = false;
        let myName = "";

        // --- AUTH ---
        document.getElementById('btn-create').onclick = () => {
            myName = document.getElementById('p-name').value;
            if(!myName) return;
            roomID = Math.random().toString(36).substring(2,6).toUpperCase();
            isHost = true;
            initPlayer();
        };

        document.getElementById('btn-join').onclick = () => {
            myName = document.getElementById('p-name').value;
            roomID = document.getElementById('r-code').value.toUpperCase();
            if(!myName || !roomID) return;
            initPlayer();
        };

        function initPlayer() {
            const ref = db.ref('rooms/' + roomID);
            if(isHost) ref.set({ status: 'waiting', host: myID, deck: genDeck(), discard: "-", discardPile: [], chat: [] });
            ref.child('players/' + myID).set({ name: myName, points: 0, status: "Feu Rouge", hand: [] });
            
            ref.on('value', snap => {
                const data = snap.val();
                if(!data) return;
                syncGame(data);
                if(data.chat) syncChat(data.chat);
            });
        }

        function syncGame(data) {
            const indicator = document.getElementById('turn-indicator');
            if(data.status === 'playing') {
                if(data.turn === myID) {
                    indicator.innerText = "🚀 C'est à toi de jouer !";
                    indicator.className = "my-turn";
                } else {
                    const otherName = data.players[data.turn] ? data.players[data.turn].name : "un autre";
                    indicator.innerText = `⏳ Tour de ${otherName}...`;
                    indicator.className = "other-turn";
                }
            }

            if(data.status === 'waiting') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('wait-screen').classList.remove('hidden');
                document.getElementById('display-code').innerText = roomID;
                document.getElementById('p-list').innerHTML = Object.values(data.players).map(p => `<li>🏎️ ${p.name}</li>`).join("");
                if(data.host === myID) document.getElementById('btn-start').classList.remove('hidden');
            } else {
                render(data);
            }
        }

        // --- CHAT ---
        document.getElementById('btn-send').onclick = sendMsg;
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === "Enter") sendMsg(); };
        function sendMsg() {
            const input = document.getElementById('chat-input');
            if(!input.value || !roomID) return;
            db.ref('rooms/' + roomID + '/chat').push({ user: myName, text: input.value });
            input.value = "";
        }
        function syncChat(chatObj) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = "";
            Object.values(chatObj).forEach(m => {
                const d = document.createElement('div');
                d.className = "msg";
                d.innerHTML = `<b>${m.user}</b>${m.text}`;
                container.appendChild(d);
            });
            container.scrollTop = container.scrollHeight;
        }

        // --- RENDER ---
        document.getElementById('btn-start').onclick = async () => {
            const snap = await db.ref('rooms/' + roomID).get();
            const data = snap.val();
            let d = [...data.deck];
            let up = {};
            Object.keys(data.players).forEach(id => { up['players/'+id+'/hand'] = d.splice(0,6); });
            up.deck = d; up.status = 'playing'; up.turn = myID;
            db.ref('rooms/' + roomID).update(up);
        };

        function render(data) {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-board').classList.remove('hidden');
            document.getElementById('deck-count').innerText = data.deck ? data.deck.length : 0;
            document.getElementById('last-card').innerText = data.discard;

            const layer = document.getElementById('players-layer');
            layer.innerHTML = "";
            const ids = Object.keys(data.players);
            ids.forEach((id, i) => {
                const p = data.players[id];
                const angle = (i / ids.length) * 2 * Math.PI;
                const distH = window.innerWidth < 900 ? 120 : 200;
                const distV = window.innerWidth < 900 ? 80 : 120;
                const x = Math.cos(angle) * distH + (document.getElementById('game-board').clientWidth/2);
                const y = Math.sin(angle) * distV + (document.getElementById('game-board').clientHeight/2);
                
                const div = document.createElement('div');
                div.className = "slot " + (data.turn === id ? "active" : "");
                div.style.left = x + "px"; div.style.top = y + "px";
                div.innerHTML = `<div class="avatar">${p.status==="En route"?"🏎️":"🛑"}</div><b>${p.name}</b><br><small>${p.points} km</small>`;
                layer.appendChild(div);
                if(id === myID) drawHand(p.hand || [], data.turn === myID, data);
            });
        }

        function drawHand(hand, isTurn, data) {
            const cont = document.getElementById('hand-container');
            cont.innerHTML = "";
            hand.forEach((card, i) => {
                const div = document.createElement('div');
                const type = isNaN(card) ? (['Essence','Roue de Secours','Réparations','Feu Vert'].includes(card)?"defense":"attaque") : "borne";
                div.className = `card ${type}`;
                div.innerHTML = `<span>${getEmoji(card)}</span> ${card}`;
                div.onclick = () => { if(isTurn) openAct(card, i, data); };
                cont.appendChild(div);
            });
        }

        function openAct(card, idx, data) {
            const mod = document.getElementById('modal');
            const btns = document.getElementById('modal-btns');
            mod.classList.remove('hidden');
            document.getElementById('modal-title').innerText = card;
            btns.innerHTML = "";

            const isBorne = !isNaN(card);
            const isAttaque = isBorne ? false : !['Essence','Roue de Secours','Réparations','Feu Vert'].includes(card);

            if(isBorne && data.players[myID].status !== "En route") {
                btns.innerHTML = "<p style='color:#e74c3c; font-weight:bold'>🛑 Stop ! Tu n'as pas le feu vert.</p>";
            } else if(isAttaque) {
                Object.keys(data.players).forEach(id => {
                    if(id !== myID) {
                        const b = document.createElement('button');
                        b.innerText = "Attaquer " + data.players[id].name;
                        b.style.background = "#e74c3c"; b.style.color = "white";
                        b.onclick = () => doMove(card, idx, data, false, id);
                        btns.appendChild(b);
                    }
                });
            } else {
                const b = document.createElement('button');
                b.innerText = "Utiliser"; b.style.background="#2ecc71"; b.style.color="white";
                b.onclick = () => doMove(card, idx, data, false, myID);
                btns.appendChild(b);
            }
            const d = document.createElement('button');
            d.innerText = "Défausser"; d.style.background="#bdc3c7";
            d.onclick = () => doMove(card, idx, data, true);
            btns.appendChild(d);
        }

        async function doMove(card, idx, data, isDisc, targetID = null) {
            closeModal();
            let up = {};
            let hand = [...data.players[myID].hand];
            let deck = data.deck ? [...data.deck] : [];
            let discardPile = data.discardPile ? [...data.discardPile] : [];
            
            // Retirer la carte de la main
            hand.splice(idx, 1);
            
            // Ajouter la carte à la défausse interne (pour recyclage)
            discardPile.push(card);

            // GESTION DU RECYCLAGE DU DECK
            if(deck.length === 0 && discardPile.length > 1) {
                // On garde la dernière carte jouée comme défausse visible, on mélange le reste
                const lastPlayed = discardPile.pop();
                deck = discardPile.sort(() => Math.random() - 0.5);
                discardPile = [lastPlayed];
                // Message système dans le chat
                db.ref('rooms/' + roomID + '/chat').push({ user: "SYSTEM", text: "🔄 La défausse a été mélangée dans la pioche !" });
            }

            // Piocher une carte
            if(deck.length > 0) {
                hand.push(deck.shift());
            }

            up['players/'+myID+'/hand'] = hand;
            up.deck = deck;
            up.discard = card;
            up.discardPile = discardPile;

            if(!isDisc) {
                if(!isNaN(card)) {
                    up['players/'+myID+'/points'] = (data.players[myID].points || 0) + parseInt(card);
                    // Victoire
                    if((data.players[myID].points + parseInt(card)) >= 1000) {
                        db.ref('rooms/' + roomID + '/chat').push({ user: "🏁", text: `VICTOIRE de ${myName} !!!` });
                    }
                } else if(targetID) {
                    const isDef = ['Essence','Roue de Secours','Réparations','Feu Vert'].includes(card);
                    up['players/'+targetID+'/status'] = isDef ? "En route" : "En panne";
                }
            }
            const ids = Object.keys(data.players);
            up.turn = ids[(ids.indexOf(myID)+1)%ids.length];
            db.ref('rooms/'+roomID).update(up);
        }

        function genDeck() {
            let d = [];
            const add = (c,n) => { while(n--) d.push(c); };
            // Deck équilibré
            add("25", 10); add("50", 10); add("75", 10); add("100", 12); add("200", 4);
            add("Panne d'essence", 6); add("Crevaison", 6); add("Accident", 6); add("Feu Rouge", 8); 
            add("Essence", 6); add("Roue de Secours", 6); add("Réparations", 6); add("Feu Vert", 14);
            return d.sort(() => Math.random() - 0.5);
        }

        function getEmoji(c) {
            if(!isNaN(c)) return "🏁";
            if(c.includes("essence") || c === "Essence") return "⛽";
            if(c.includes("Crevaison") || c === "Roue de Secours") return "🛞";
            if(c.includes("Accident") || c === "Réparations") return "🛠️";
            return "🚦";
        }
        window.closeModal = () => document.getElementById('modal').classList.add('hidden');
    </script>
</body>
</html>
