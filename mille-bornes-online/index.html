<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mille Bornes Royale 🏎️</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #0b0e14; 
            --accent: #f1c40f; 
            --table: linear-gradient(135deg, #1e8449 0%, #27ae60 100%);
            --card-shadow: 0 10px 20px rgba(0,0,0,0.4);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); color: white; height: 100vh; 
            display: flex; overflow: hidden;
            background-image: radial-gradient(circle at center, #1c2541 0%, #0b0e14 100%);
        }

        .hidden { display: none !important; }

        /* --- UI ELEMENTS --- */
        #turn-indicator {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; border-radius: 50px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; z-index: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--glass);
            backdrop-filter: blur(10px); text-align: center; min-width: 280px;
        }
        .my-turn { background: rgba(241, 196, 15, 0.2); border-color: var(--accent) !important; color: var(--accent); animation: pulse 2s infinite; }
        .other-turn { background: rgba(0, 0, 0, 0.6); color: rgba(255,255,255,0.6); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); }
            100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }

        #main-container { flex: 1; position: relative; display: flex; flex-direction: column; }
        #chat-sidebar { width: 300px; background: rgba(0,0,0,0.6); border-left: 2px solid var(--glass); display: flex; flex-direction: column; backdrop-filter: blur(15px); }

        /* --- LOBBY --- */
        #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1000; background: var(--bg); }
        .box { background: var(--glass); padding: 30px; border-radius: 25px; text-align: center; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: var(--accent); margin-bottom: 20px; }
        input { padding: 12px; border-radius: 10px; border: 1px solid var(--glass); margin: 8px 0; width: 100%; background: rgba(0,0,0,0.3); color: white; }
        button { padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: #1a1a2e; font-weight: 800; cursor: pointer; width: 100%; }

        /* --- TABLE & CARDS --- */
        #game-board { flex: 1; position: relative; }
        #table {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 500px; height: 200px; background: var(--table);
            border: 8px solid #145a32; border-radius: 100px;
            display: flex; justify-content: center; align-items: center; gap: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .slot { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 100px; }
        .avatar { width: 50px; height: 50px; background: #2c3e50; border-radius: 50%; border: 3px solid white; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .active .avatar { border-color: var(--accent); box-shadow: 0 0 20px var(--accent); }

        #hand-container {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 15px;
            display: flex; gap: 8px; justify-content: center; overflow-x: auto;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }
        .card {
            min-width: 70px; height: 100px; background: white; color: #1a1a2e;
            border-radius: 8px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: space-around; padding: 5px;
            font-weight: 900; font-size: 0.65rem; border: 3px solid #ccc; box-shadow: var(--card-shadow);
        }
        .card:active { transform: scale(0.9); }
        .card.borne { border-color: #2ecc71; }
        .card.attaque { border-color: #e74c3c; }
        .card.defense { border-color: #3498db; }

        /* --- MODAL --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: white; color: #1a1a2e; padding: 25px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; }
        #modal-btns button { margin: 5px 0; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            #chat-sidebar { width: 100%; height: 150px; border-left: none; border-top: 1px solid var(--glass); }
            #table { height: 150px; width: 90%; }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="turn-indicator" class="other-turn">En attente...</div>

        <div id="lobby">
            <div id="auth-screen" class="box">
                <h1>🏎️ MILLE BORNES</h1>
                <input type="text" id="p-name" placeholder="Ton pseudo">
                <button id="btn-create">CRÉER SALON</button>
                <div style="margin:10px; opacity:0.5">OU</div>
                <input type="text" id="r-code" placeholder="CODE">
                <button id="btn-join" style="background:transparent; color:white; border:2px solid var(--accent)">REJOINDRE</button>
            </div>
            <div id="wait-screen" class="box hidden">
                <h2>Salon: <span id="display-code" style="color:var(--accent)"></span></h2>
                <div id="p-list" style="margin:20px 0; text-align: left;"></div>
                <button id="btn-start" class="hidden" style="background:#2ecc71; color:white">DÉMARRER</button>
            </div>
        </div>

        <div id="game-board" class="hidden">
            <div id="table">
                <div style="text-align:center">🎴 Pioche<br><b id="deck-count" style="font-size: 1.5rem;">0</b></div>
                <div style="text-align:center">🗑️ Rebut<br><b id="last-card" style="color:var(--accent)">-</b></div>
            </div>
            <div id="players-layer"></div>
            <div id="hand-container"></div>
        </div>
    </div>

    <div id="chat-sidebar">
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; font-size:0.8rem;"></div>
        <div style="display:flex; padding:5px; gap:5px;">
            <input type="text" id="chat-input" placeholder="Chat..." style="margin:0; padding:8px;">
            <button id="btn-send" style="width:50px; padding:0;">OK</button>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Action</h3>
            <div id="modal-btns" style="display:flex; flex-direction:column;"></div>
            <button style="background:#ddd; margin-top:10px;" onclick="closeModal()">Annuler</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyDadsPbXI4xMieRDWgZMOb3WzkP8f7aonc",
            authDomain: "mille-bornes-vibe.firebaseapp.com",
            projectId: "mille-bornes-vibe",
            databaseURL: "https://mille-bornes-vibe-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        let myID = "P" + Math.floor(Math.random()*9999);
        let roomID = null, isHost = false, myName = "";

        // --- GESTION DES SALONS ---
        document.getElementById('btn-create').onclick = () => {
            myName = document.getElementById('p-name').value;
            if(!myName) return;
            roomID = Math.random().toString(36).substring(2,6).toUpperCase();
            isHost = true;
            joinRoom();
        };

        document.getElementById('btn-join').onclick = () => {
            myName = document.getElementById('p-name').value;
            roomID = document.getElementById('r-code').value.toUpperCase();
            if(!myName || !roomID) return;
            joinRoom();
        };

        function joinRoom() {
            const ref = db.ref('rooms/' + roomID);
            
            // --- LOGIQUE DE NETTOYAGE (Auto-delete) ---
            // On s'attache à la liste des joueurs
            const playerRef = ref.child('players/' + myID);
            
            if(isHost) {
                ref.set({ status: 'waiting', host: myID, deck: genDeck(), discard: "-", discardPile: [], chat: [] });
            }

            playerRef.set({ name: myName, points: 0, status: "Feu Rouge", hand: [] });

            // Quand je me déconnecte, je supprime mon joueur
            playerRef.onDisconnect().remove();

            // Si je suis le dernier, Firebase supprimera la room car elle sera vide
            // On ajoute un check spécial : si plus de joueurs, supprimer la room
            ref.child('players').on('value', snap => {
                if(!snap.exists()) {
                    ref.remove();
                }
            });

            ref.on('value', snap => {
                const data = snap.val();
                if(!data) { 
                    location.reload(); // La room a été supprimée
                    return; 
                }
                syncGame(data);
            });
        }

        function syncGame(data) {
            const indicator = document.getElementById('turn-indicator');
            if(data.status === 'playing') {
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game-board').classList.remove('hidden');
                
                const isMyTurn = data.turn === myID;
                indicator.innerText = isMyTurn ? "🚀 À TOI DE JOUER !" : `⏳ Tour de ${data.players[data.turn].name}`;
                indicator.className = isMyTurn ? "my-turn" : "other-turn";

                document.getElementById('deck-count').innerText = data.deck ? data.deck.length : 0;
                document.getElementById('last-card').innerText = data.discard;

                renderPlayers(data);
                if(data.chat) renderChat(data.chat);
            } else {
                document.getElementById('wait-screen').classList.remove('hidden');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('display-code').innerText = roomID;
                document.getElementById('p-list').innerHTML = Object.values(data.players).map(p => `• ${p.name}`).join("<br>");
                if(isHost && Object.keys(data.players).length >= 2) document.getElementById('btn-start').classList.remove('hidden');
            }
        }

        function renderPlayers(data) {
            const layer = document.getElementById('players-layer');
            layer.innerHTML = "";
            const ids = Object.keys(data.players);
            ids.forEach((id, i) => {
                const p = data.players[id];
                const angle = (i / ids.length) * 2 * Math.PI;
                const x = Math.cos(angle) * 130 + (window.innerWidth / 2.5);
                const y = Math.sin(angle) * 80 + (window.innerHeight / 3);
                
                const div = document.createElement('div');
                div.className = "slot " + (data.turn === id ? "active" : "");
                div.style.left = x + "px"; div.style.top = y + "px";
                div.innerHTML = `<div class="avatar">${p.status==="En route"?"🏎️":"🛑"}</div><b>${p.name}</b><br><small>${p.points} km</small>`;
                layer.appendChild(div);
                if(id === myID) renderHand(p.hand || [], data.turn === myID, data);
            });
        }

        function renderHand(hand, isMyTurn, data) {
            const cont = document.getElementById('hand-container');
            cont.innerHTML = "";
            hand.forEach((card, i) => {
                const div = document.createElement('div');
                const type = isNaN(card) ? (['Essence','Roue de Secours','Réparations','Feu Vert'].includes(card)?"defense":"attaque") : "borne";
                div.className = `card ${type}`;
                div.innerHTML = `<span>${getEmoji(card)}</span> ${card}`;
                div.onclick = () => { if(isMyTurn) openAction(card, i, data); };
                cont.appendChild(div);
            });
        }

        function openAction(card, idx, data) {
            const mod = document.getElementById('modal');
            const btns = document.getElementById('modal-btns');
            mod.classList.remove('hidden');
            document.getElementById('modal-title').innerText = card;
            btns.innerHTML = "";

            const isBorne = !isNaN(card);
            const isAttaque = isBorne ? false : !['Essence','Roue de Secours','Réparations','Feu Vert'].includes(card);

            if(isBorne && data.players[myID].status !== "En route") {
                btns.innerHTML = "<p style='color:red'>Tu n'as pas le feu vert !</p>";
            } else if(isAttaque) {
                Object.keys(data.players).forEach(id => {
                    if(id !== myID) {
                        const b = document.createElement('button');
                        b.innerText = "Attaquer " + data.players[id].name;
                        b.onclick = () => playCard(card, idx, data, false, id);
                        btns.appendChild(b);
                    }
                });
            } else {
                const b = document.createElement('button');
                b.innerText = "Utiliser";
                b.style.background = "#2ecc71";
                b.onclick = () => playCard(card, idx, data, false, myID);
                btns.appendChild(b);
            }
            
            const d = document.createElement('button');
            d.innerText = "Défausser";
            d.onclick = () => playCard(card, idx, data, true);
            btns.appendChild(d);
        }

        async function playCard(card, idx, data, isDiscard, targetID = null) {
            closeModal();
            let up = {};
            let hand = [...data.players[myID].hand];
            let deck = data.deck ? [...data.deck] : [];
            let discardPile = data.discardPile ? [...data.discardPile] : [];
            
            hand.splice(idx, 1);
            discardPile.push(card);

            // Recyclage du deck
            if(deck.length === 0 && discardPile.length > 1) {
                const last = discardPile.pop();
                deck = discardPile.sort(() => Math.random() - 0.5);
                discardPile = [last];
            }

            if(deck.length > 0) hand.push(deck.shift());

            up['players/'+myID+'/hand'] = hand;
            up.deck = deck;
            up.discard = card;
            up.discardPile = discardPile;

            if(!isDiscard) {
                if(!isNaN(card)) {
                    const newPoints = (data.players[myID].points || 0) + parseInt(card);
                    up['players/'+myID+'/points'] = newPoints;
                    if(newPoints >= 1000) alert("VICTOIRE !");
                } else if(targetID) {
                    const isDef = ['Essence','Roue de Secours','Réparations','Feu Vert'].includes(card);
                    up['players/'+targetID+'/status'] = isDef ? "En route" : "En panne";
                }
            }

            const ids = Object.keys(data.players);
            up.turn = ids[(ids.indexOf(myID)+1)%ids.length];
            db.ref('rooms/'+roomID).update(up);
        }

        document.getElementById('btn-start').onclick = async () => {
            const snap = await db.ref('rooms/'+roomID).get();
            const data = snap.val();
            let d = [...data.deck];
            let up = {};
            Object.keys(data.players).forEach(id => { up['players/'+id+'/hand'] = d.splice(0,6); });
            up.deck = d; up.status = 'playing'; up.turn = myID;
            db.ref('rooms/'+roomID).update(up);
        };

        function genDeck() {
            let d = [];
            const add = (c,n) => { while(n--) d.push(c); };
            add("25", 10); add("50", 10); add("75", 10); add("100", 12); add("200", 4);
            add("Panne d'essence", 6); add("Crevaison", 6); add("Accident", 6); add("Feu Rouge", 8); 
            add("Essence", 6); add("Roue de Secours", 6); add("Réparations", 6); add("Feu Vert", 14);
            return d.sort(() => Math.random() - 0.5);
        }

        function getEmoji(c) {
            if(!isNaN(c)) return "🏁";
            if(c.includes("essence") || c === "Essence") return "⛽";
            if(c.includes("Crevaison") || c === "Roue de Secours") return "🛞";
            if(c.includes("Accident") || c === "Réparations") return "🛠️";
            return "🚦";
        }

        function renderChat(chat) {
            const cont = document.getElementById('chat-messages');
            cont.innerHTML = Object.values(chat).map(m => `<div><b>${m.user}:</b> ${m.text}</div>`).join("");
            cont.scrollTop = cont.scrollHeight;
        }

        document.getElementById('btn-send').onclick = () => {
            const inp = document.getElementById('chat-input');
            if(inp.value) db.ref('rooms/'+roomID+'/chat').push({user: myName, text: inp.value});
            inp.value = "";
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');
    </script>
</body>
</html>
