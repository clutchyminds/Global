<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Bloc-notes avec image et PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Style identique à l’outil précédent, raccourci ici */
    body {font-family: Arial,sans-serif; background:#f0f0f0; margin:0;}
    .container {background:#fff;max-width:580px;margin:35px auto 16px auto;border-radius:18px;box-shadow:0 2px 14px #bbb;padding:35px 22px 30px 22px; text-align:center;}
    textarea {width:98%;min-height:220px;max-height:520px;border-radius:13px;border:1.5px solid #b7dbf7;padding:13px;font-size:1.07rem;resize:vertical;margin-bottom:18px;}
    .export-btn {background:#33bf40;color:#fff;border:none;border-radius:10px;font-weight:bold;padding:10px 30px;font-size:1.13rem;cursor:pointer;margin-bottom:10px;transition:background .19s;box-shadow:0 1px 6px #71c58933;}
    .export-btn:hover {background:#22912b;}
    .notification {color:#007BFF;margin:8px auto 10px auto;font-weight:500;font-size:1rem;letter-spacing:.1px;min-height:18px;}
    .img-preview {margin-top:10px;max-width:90%;max-height:210px;border-radius:12px;box-shadow:0 1px 6px #ccc;}
  </style>
</head>
<body>
  <div class="container">
    <h2>Bloc-notes avec image & PDF</h2>
    <textarea id="notesInput" placeholder="Tape ici tes notes, idées, résumés, listes…"></textarea>
    <br>
    <input type="file" id="imgInput" accept="image/*">
    <div id="imgContainer"></div>
    <br>
    <button class="export-btn" onclick="exportPDF()">Exporter en PDF</button>
    <div class="notification" id="notif"></div>
  </div>
  <script>
    let imgDataUrl = null;
    document.getElementById('imgInput').addEventListener('change', function(e){
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev){
        imgDataUrl = ev.target.result;
        const imgEl = document.createElement('img');
        imgEl.src = imgDataUrl;
        imgEl.className = "img-preview";
        imgEl.onload = ()=>{};
        const cont = document.getElementById('imgContainer');
        cont.innerHTML = ""; cont.appendChild(imgEl);
      };
      reader.readAsDataURL(file);
    });

    function exportPDF() {
      const texte = document.getElementById('notesInput').value.trim();
      if (!texte && !imgDataUrl) { notif("Rien à exporter !"); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 18;
      // Ajoute texte
      if (texte) {
        const lines = doc.splitTextToSize(texte, 180);
        doc.setFontSize(13);
        lines.forEach(line => {
          if (y > 275) { doc.addPage(); y = 18; }
          doc.text(line, 16, y);
          y += 8;
        });
      }
      // Ajoute image
      if (imgDataUrl) {
        if (y > 230) { doc.addPage(); y = 18; }
        doc.addImage(imgDataUrl, 'JPEG', 15, y+7, 180, 0); // Taille auto hauteur
        y += 70;
      }
      doc.save("notes.pdf");
      notif("Export PDF téléchargé !");
    }
    function notif(msg) {
      const el = document.getElementById('notif');
      el.textContent = msg;
      setTimeout(()=>{el.textContent='';}, 1900);
    }
  </script>
</body>
</html>
