<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L'Odyssée du Photon</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        #quiz-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 500px; background: rgba(240, 255, 240, 0.98);
            padding: 25px; border-radius: 25px; display: none; flex-direction: column;
            border: 4px solid #27ae60; box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index: 100;
        }
        #question-text { color: #1e8449; font-size: 20px; margin-bottom: 20px; text-align: center; }
        .option-btn {
            background: linear-gradient(145deg, #2ecc71, #27ae60); color: white;
            border: none; padding: 15px; margin: 8px; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #196f3d;
        }
        .option-btn:active { transform: translateY(2px); box-shadow: 0 2px #196f3d; }
    </style>
</head>
<body>
    <div id="quiz-container">
        <div id="question-text">Chargement du bilan...</div>
        <div id="options" style="display: flex; flex-direction: column;"></div>
    </div>
    <script src="./js/questions.js"></script>
    <script src="./js/game.js"></script>
</body>
</html>
