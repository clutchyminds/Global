<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Casse-brique - Jeux</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0;}
    .top-banner { background-color: #007BFF; color: white; padding: 18px 0 0 0; font-size: 2rem; letter-spacing: 1px; font-weight: bold;}
    .nav-bar { display: flex; justify-content: center; gap: 40px; background-color: #007BFF; padding: 10px 0 18px 0; margin: 0;}
    .nav-bar a { color: white; text-decoration: none; font-size: 1.1rem; font-weight: 500; padding: 5px 18px; border-radius: 12px; transition: background 0.2s, color 0.2s;}
    .nav-bar a:hover { background: #0057b8; color: #fffbea;}
    #game-container { margin: 32px auto 32px auto; background: white; border-radius: 22px; padding: 25px; box-shadow: 0 2px 12px #bbb; max-width: 650px; text-align:center;}
    canvas { display: block; margin: auto; background: #f0f0f0; border-radius: 18px; box-shadow: 0 1px 10px #aaa; border: 2px solid #007BFF; touch-action: none;}
    .score { font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; color: #007BFF;}
    .level { font-size: 1.15rem; color: #555; margin-bottom: 18px;}
    .footer-links { margin-top: 20px; text-align:center;}
    .footer-links a { color: #007BFF; text-decoration: none; margin: 0 7px; font-weight: bold; font-size: 1.03rem;}
    .bottom-footer { background-color: #333; color: #eee; padding: 16px 0; text-align: center; font-size: 1rem; position: fixed; left: 0; right: 0; bottom: 0; box-shadow: 0 -1px 8px #bbb;}
    .page-padding { padding-bottom: 60px;}
    .btn { font-size: 1rem; padding: 8px 18px; margin-top: 18px; color: white; background: #007BFF; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: background 0.2s;}
    .btn:hover { background: #0057b8;}
    .level-icon { cursor: pointer; margin:8px; padding:8px; border-radius:9px; border:2px solid #007BFF; display:inline-block; text-align:center; transition: box-shadow 0.2s;}
    .level-icon:hover { box-shadow: 0 2px 8px #aaa;}
    .level-icon img { border-radius: 6px; border: 1px solid #bbb;}
  </style>
</head>
<body>
  <div class="top-banner">
    Casse-brique
    <nav class="nav-bar">
      <a href="../index.html">Accueil</a>
      <a href="apropos.html">À propos</a>
    </nav>
  </div>
  <div class="page-padding">
    <!-- Sélection des niveaux -->
    <div id="level-selection" style="max-width:650px; margin: 32px auto; text-align:center;">
      <h2>Choisissez un niveau</h2>
      <div id="levels-list" style="display:flex; flex-wrap:wrap; justify-content:center; gap:12px;">
        <!-- Icônes des niveaux générées en JS -->
      </div>
    </div>
    <div id="game-container">
      <div class="score">Score : <span id="score">0</span></div>
      <div class="level">Niveau : <span id="level">1</span>/20</div>
      <canvas id="gameCanvas" width="600" height="400"></canvas>
      <button class="btn" id="restartBtn" style="display:none;">Accueil niveaux</button>
    </div>
  </div>
  <div class="bottom-footer">
    ©Global — Créé par Thomas Lewis | Code : Thomas Lewis ; Comptenu des cour : Perplexity (ia)
  </div>
  <script>
    // --- Sélection d'écran ---
    const maxLevel = 20;
    const levelSelection = document.getElementById('level-selection');
    const levelsList = document.getElementById('levels-list');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');
    const restartBtn = document.getElementById('restartBtn');

    // Génère dynamiquement les icônes de niveau (remplace les src par tes images !)
    for(let i=1;i<=maxLevel;i++){
      levelsList.innerHTML += `
        <div class="level-icon" onclick="selectLevel(${i})">
        <img src="niveau${i}.png" alt="Niveau ${i}" width="80" height="50">
        <div>Niveau ${i}</div>
        </div>`
    }

    // --- Jeu ---
    let bricks = [], ball, paddle;
    let score = 0, level = 1, lives = 3;
    let gameRunning = false, waitingNextLevel = false;

    // Paramètres des briques
    const brickRowBase = 4, brickColBase = 9;
    const brickWidth = 58, brickHeight = 20, brickPadding = 7, brickOffsetTop = 30, brickOffsetLeft = 18;

    // Types de briques
    const brickTypes = [
      { color: "#007BFF" }, // normal
      { color: "#43ea3d" }, // bonus paddle large
      { color: "#ffeb3b" }, // bonus extra-ball
      { color: "#dd3333" }, // malus paddle small
      { color: "#ff9100" }  // malus balle rapide
    ];

    function createLevel(n) {
      bricks = [];
      const rows = brickRowBase + Math.floor(n / 3);
      const cols = brickColBase + Math.floor(n / 4);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let type = 0;
          let specialChance = Math.random();
          if (specialChance < 0.08 + n*0.012) type = 1;
          else if (specialChance < 0.16 + n*0.014) type = 2;
          else if (specialChance > 0.86 - n*0.008) type = 3;
          else if (specialChance > 0.78 - n*0.009) type = 4;
          bricks.push({
            x: brickOffsetLeft + c*(brickWidth+brickPadding),
            y: brickOffsetTop + r*(brickHeight+brickPadding),
            status: 1, type: type
          });
        }
      }
    }
    function initBall() {
      ball = {
        x: canvas.width/2,
        y: canvas.height-80,
        dx: (2 + 0.1*level)*(Math.random() < 0.5 ? 1 : -1),
        dy: -3 - 0.18*level,
        radius: 9,
        speedMult: 1
      };
    }
    function initPaddle() {
      paddle = {
        width: 92,
        height: 18,
        x: canvas.width/2 - 46,
        y: canvas.height-36,
        dx: 0,
        speed: 9
      };
    }

    function startLevel(lvl){
      createLevel(lvl);
      initBall();
      initPaddle();
      levelElement.textContent = lvl;
      gameRunning = true;
      restartBtn.style.display = "none";
      waitingNextLevel = false;
      document.body.focus();
      draw(); // premier affichage
    }

    // --- Sélection de niveau ---
    window.selectLevel = function(lvl) {
      level = lvl;
      score = 0;
      lives = 3;
      scoreElement.textContent = score;
      levelElement.textContent = level;
      levelSelection.style.display = "none";
      gameContainer.style.display = "block";
      startLevel(level);
      gameLoop();
    }

    // Afficher la sélection au début
    gameContainer.style.display = "none";
    levelSelection.style.display = "block";

    // --- Draw ---
    function drawBricks() {
      bricks.forEach(brick => {
        if (brick.status) {
          ctx.fillStyle = brickTypes[brick.type].color;
          ctx.fillRect(brick.x, brick.y, brickWidth, brickHeight);
          if(brick.type !== 0) {
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "#fff";
            ctx.fillText(
              brick.type==1 ? "+" : (brick.type==2 ? "B" : (brick.type==3 ? "-" : "F")),
              brick.x+brickWidth/2-6, brick.y+brickHeight/2+6
            );
          }
        }
      });
    }
    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
      ctx.fillStyle = "#007BFF";
      ctx.fill();
      ctx.closePath();
    }
    function drawPaddle() {
      ctx.fillStyle = "#222";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
    }

    // --- Game Logic
    let rightPressed = false, leftPressed = false;
    document.addEventListener('keydown', (e) => {
      if (e.key === "ArrowRight" || e.key === "d") rightPressed = true;
      if (e.key === "ArrowLeft" || e.key === "q") leftPressed = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === "ArrowRight" || e.key === "d") rightPressed = false;
      if (e.key === "ArrowLeft" || e.key === "q") leftPressed = false;
    });
    canvas.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      let mouseX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(mouseX - paddle.width/2, canvas.width-paddle.width));
    });
    canvas.addEventListener('touchmove', function(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches.length > 0) {
        let touchX = e.touches[0].clientX - rect.left;
        paddle.x = Math.max(0, Math.min(touchX - paddle.width/2, canvas.width-paddle.width));
        e.preventDefault();
      }
    }, { passive: false });

    function collisionDetection() {
      // Ball collisions bricks
      for(let i=0; i<bricks.length; i++) {
        let b = bricks[i];
        if(b.status) {
          if(ball.x > b.x && ball.x < b.x+brickWidth && ball.y-ball.radius > b.y && ball.y-ball.radius < b.y+brickHeight) {
            ball.dy = -ball.dy;
            b.status = 0;
            let addScore = 10; // bonus/malus
            switch(b.type) {
              case 1: paddle.width = Math.min(paddle.width+29, 150); break;
              case 2: score += 50; break;
              case 3: paddle.width = Math.max(paddle.width-32, 39); break;
              case 4: ball.speedMult = Math.min(ball.speedMult+0.38, 2.8); break;
            }
            score += addScore;
            scoreElement.textContent = score;
            // Niveau terminé ?
            if (bricks.every(bk=>bk.status==0)) {
              waitingNextLevel = true;
              setTimeout(()=>{
                level++;
                if(level>maxLevel) {
                  alert("Bravo ! Tu as fini les 20 niveaux !");
                  gameRunning = false;
                  restartBtn.style.display = "block";
                } else {
                  startLevel(level);
                }
              },990);
            }
          }
        }
      }
    }
    function movePaddle() {
      if (rightPressed) paddle.x += paddle.speed;
      if (leftPressed) paddle.x -= paddle.speed;
      paddle.x = Math.max(0, Math.min(paddle.x, canvas.width - paddle.width));
    }
    function moveBall() {
      ball.x += ball.dx * ball.speedMult;
      ball.y += ball.dy * ball.speedMult;
      // Murs
      if(ball.x-ball.radius < 0 || ball.x+ball.radius > canvas.width) ball.dx = -ball.dx;
      if(ball.y-ball.radius < 0) ball.dy = -ball.dy;
      // Paddle
      if(ball.x > paddle.x && ball.x < paddle.x+paddle.width && ball.y+ball.radius > paddle.y && ball.y-ball.radius < paddle.y+paddle.height) {
        ball.dy = -ball.dy;
        let hitPos = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
        ball.dx = (3+0.2*level)*hitPos;
      }
      // Balle perdue
      if(ball.y-ball.radius > canvas.height && !waitingNextLevel) {
        lives--;
        if(lives>0) {
          initBall();
          initPaddle();
        } else {
          alert("Perdu ! Score final : "+score);
          gameRunning = false;
          restartBtn.style.display = "block";
        }
      }
    }
    function gameLoop() {
      if(gameRunning) {
        draw();
        movePaddle();
        moveBall();
        collisionDetection();
        requestAnimationFrame(gameLoop);
      }
    }

    // Bouton redirection sélection (Accueil niveaux)
    restartBtn.onclick = ()=>{
      gameRunning = false;
      gameContainer.style.display = "none";
      levelSelection.style.display = "block";
    };

    // Au départ, rien ne se lance tant qu’on n’a pas choisi le niveau !

  </script>
</body>
</html>
